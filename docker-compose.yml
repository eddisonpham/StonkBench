services:
  # Base service definition (not run directly)
  base:
    build:
      context: .
      dockerfile: Dockerfile.base
    image: sdgfts-base:latest
    volumes:
      - ./data:/data
      - ./generated_data:/generated_data
      - ./results:/results
      - ./evaluation_plots:/evaluation_plots
    environment:
      - CUDA_VISIBLE_DEVICES=${CUDA_VISIBLE_DEVICES:-}
    networks:
      - default

  # Data download and preprocessing service
  data-download:
    extends:
      service: base
    container_name: sdgfts-data-download
    command: >
      src/data_downloader.py
      --index SPY QQQ IWM XLF XLV AAPL MSFT NVDA AVGO JPM LLY UNH AMZN TSLA CAT UNP META NFLX PG COST XOM CVX NEE PLD LIN
      --start 2023-01-01
      --end 2025-01-01
    volumes:
      - ./data:/data
    healthcheck:
      test: ["CMD", "test", "-f", "/data/combined_data.csv"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

  data-preprocess:
    extends:
      service: base
    container_name: sdgfts-data-preprocess
    command: >
      src/data_preprocessing.py
      --input_csv /data/combined_data.csv
      --output_dir /data/preprocessed
      --window_size 21
      --stride 1
      --train_ratio 0.8
    depends_on:
      data-download:
        condition: service_completed_successfully
    volumes:
      - ./data:/data
    healthcheck:
      test: ["CMD", "test", "-f", "/data/preprocessed/dl_set.pt"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

  # Statistical + deep learning model data generation
  generate-data:
    extends:
      service: base
    container_name: sdgfts-generate-data
    command: >
      src/generation_scripts/generate_data.py
      --models quantgan timegan timegrad timevae unconditional_tsdiffusion vrnn gbm_adapter block_bootstrap
      --generation_length 60
      --num_samples 1000
      --seed 42
      --output_root /generated_data/src/experiments
    depends_on:
      data-preprocess:
        condition: service_completed_successfully
    volumes:
      - data:/data:ro
      - generated_data:/generated_data
    environment:
      - OMP_NUM_THREADS=1
      - MKL_NUM_THREADS=1
      - NUMEXPR_NUM_THREADS=1
      - OPENBLAS_NUM_THREADS=1
    deploy:
      resources:
        limits:
          cpus: '1'
  eval:
    extends:
      service: base
    container_name: sdgfts-eval
    command: >
      src/unified_evaluator.py
      --generated_dir /generated_data/src/experiments
      --results_dir /results
      --seq_lengths 60 120 180 240 300
    depends_on:
      generate-data:
        condition: service_completed_successfully
    volumes:
      - ./data:/data:ro
      - ./generated_data:/generated_data:ro
      - ./results:/results

  # Plotting service (generates paper figures)
  plot:
    extends:
      service: base
    container_name: sdgfts-plot
    command: ["src/plot_statistics/evaluation_plotter.py"]
    depends_on:
      eval:
        condition: service_completed_successfully
    volumes:
      - ./results:/results:ro
      - ./evaluation_plots:/evaluation_plots

networks:
  default:
    name: sdgfts-network
    driver: bridge

volumes:
  data:
  generated_data:
  results:
  evaluation_plots:
