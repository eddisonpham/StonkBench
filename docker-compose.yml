services:
  # Base service definition (not run directly)
  base:
    build:
      context: .
      dockerfile: Dockerfile.base
    image: sdgfts-base:latest
    volumes:
      - ./data:/data
      - ./generated_data:/generated_data
      - ./results:/results
      - ./evaluation_plots:/evaluation_plots
    environment:
      - CUDA_VISIBLE_DEVICES=${CUDA_VISIBLE_DEVICES:-}
    networks:
      - default

  # Data download and preprocessing service
  data-download:
    extends:
      service: base
    container_name: sdgfts-data-download
    command: >
      src/data_downloader.py
      --index SPY QQQ IWM XLF XLV AAPL MSFT NVDA AVGO JPM LLY UNH AMZN TSLA CAT UNP META NFLX PG COST XOM CVX NEE PLD LIN
      --start 2023-01-01
      --end 2025-01-01
    volumes:
      - ./data:/data
    healthcheck:
      test: ["CMD", "test", "-f", "/data/combined_data.csv"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

  data-preprocess:
    extends:
      service: base
    container_name: sdgfts-data-preprocess
    command: >
      src/data_preprocessing.py
      --input_csv /data/combined_data.csv
      --output_dir /data/preprocessed
      --window_size 100
      --stride 1
      --train_ratio 0.8
    depends_on:
      data-download:
        condition: service_completed_successfully
    volumes:
      - ./data:/data
    healthcheck:
      test: ["CMD", "test", "-f", "/data/preprocessed/dl_set.pt"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

  # Statistical + deep learning model data generation
  generate-data:
    extends:
      service: base
    container_name: sdgfts-generate-data
    # Use the unified adapter benchmark runner — replaces the deprecated
    # src/generation_scripts/generate_data.py. Output root + dataset paths are
    # routed via STONKBENCH_* env vars below (see src/utils/env.py).
    command: >
      -m src.experiments.run_benchmark
      --generation_length 100
      --num_samples 1000
      --seed 42
      --output_root /generated_data/output
    depends_on:
      data-preprocess:
        condition: service_completed_successfully
    volumes:
      - data:/data:ro
      - generated_data:/generated_data
    environment:
      - STONKBENCH_DL_SET_PATH=/data/preprocessed/dl_set.pt
      - STONKBENCH_STATS_SET_PATH=/data/preprocessed/statsmodel_set.pt
      - STONKBENCH_OUTPUT_ROOT=/generated_data/output
      - STONKBENCH_RUN_ID=${STONKBENCH_RUN_ID:-}
      - PYTHONPATH=/app
      - OMP_NUM_THREADS=1
      - MKL_NUM_THREADS=1
      - NUMEXPR_NUM_THREADS=1
      - OPENBLAS_NUM_THREADS=1
    deploy:
      resources:
        limits:
          cpus: '1'
  eval:
    extends:
      service: base
    container_name: sdgfts-eval
    command: >
      -m src.unified_evaluator
      --generated_dir /generated_data/output/results
      --results_dir /results
      --seq_lengths 100
      --skip_regenerate
    depends_on:
      generate-data:
        condition: service_completed_successfully
    volumes:
      - ./data:/data:ro
      - ./generated_data:/generated_data:ro
      - ./results:/results
    environment:
      - STONKBENCH_DL_SET_PATH=/data/preprocessed/dl_set.pt
      - STONKBENCH_STATS_SET_PATH=/data/preprocessed/statsmodel_set.pt
      - PYTHONPATH=/app

  # Plotting service (generates paper figures)
  plot:
    extends:
      service: base
    container_name: sdgfts-plot
    command: ["src/plot_statistics/evaluation_plotter.py"]
    depends_on:
      eval:
        condition: service_completed_successfully
    volumes:
      - ./results:/results:ro
      - ./evaluation_plots:/evaluation_plots

networks:
  default:
    name: sdgfts-network
    driver: bridge

volumes:
  data:
  generated_data:
  results:
  evaluation_plots:
